[platformio]
default_envs = legacy_uno

[env]
platform = atmelavr
framework = arduino

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

build_src_filter =
  -<*>
  +<test1.cpp>

lib_deps =
  robtillaart/MS5611 @ ^0.5.1 
  wollewald/ICM20948_WE @ 1.2.8
  SD
  https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git#v1.3.2

; Classic ATmega328P Nano: select the installed bootloader.
[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328

; Preserves the previously working configuration; does not identify the board.
[env:legacy_uno]
board = uno
